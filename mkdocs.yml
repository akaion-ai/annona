site_name: Annona
site_description: Annona — the sovereign execution kernel for AI agents. Where it runs is a decision.
site_url: https://akaion-ai.github.io/annona/
repo_url: https://github.com/akaion-ai/annona
repo_name: akaion-ai/annona
edit_uri: edit/main/docs/
copyright: Annona — an Akaion AI Lab project · Apache-2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  # The mascot in the tab and in the header. The favicon is a crop of the head:
  # the whole figure at 32 px is mud, a helmet with a red crest is not.
  logo: assets/favicon-512.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
      - Turning the perimeter on: getting-started/perimeter.md
      - Executing for a cloud app: cloud-execution.md
      - Opening it on macOS: getting-started/macos-gatekeeper.md
  - Design:
      - High-level design: design/hld.md
      - Architecture as built: design/architecture.md
      - Sovereign runtime: design/sovereign-runtime.md
      - Local interface: design/ui.md
      - Shared context and RBAC (proposal): design/shared-context.md
  - Skills: skills.md
  - Brand assets: assets/PROMPTS.md
  - Casi d'uso (IT): casi-duso.md
  - Research:
      - research/index.md
  - Reference:
      - Attachments: reference/attachments.md
      - Anonymisation and its limits: reference/anonymisation.md
      - Frontier substrates: reference/frontier-substrates.md
      - Running it on a server: reference/running-on-a-server.md
      - Backends: reference/backends.md
      - Releasing: reference/releasing.md
      - Typing debt: reference/typing-debt.md
  - Decisions:
      - adr/index.md
      - 0001 Adopt datapizza-ai: adr/0001-adopt-datapizza-ai.md
      - 0002 Unify the agentic loop: adr/0002-unify-the-agentic-loop.md
      - 0003 Ship an offline backend: adr/0003-offline-echo-backend.md
      - 0004 Name the project Dogana: adr/0004-name-the-project-dogana.md
      - 0005 Name the project Annona: adr/0005-name-the-project-annona.md
  - Contributing: contributing.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Material's icon shortcodes (:material-apple:). Without this they render as
  # literal text, which is how a landing page ends up saying
  # ":material-microsoft-windows: Windows".
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Mermaid: diagrams live in the markdown as source, so they diff and review
  # like code, and render identically on GitHub and on the docs site.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html

plugins:
  - search

watch:
  - docs
