name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0). Used when triggering manually for smoke-tests; no GitHub Release is created."
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write  # needed by the `release` job to create the GitHub Release

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon runner
            target: aarch64-apple-darwin
            pyinstaller-name: annona-aarch64-apple-darwin
          # Intel macOS: `macos-13` was retired in December 2025 and its label
          # no longer resolves to a machine — a job asking for it queues until
          # the run is cancelled, which is exactly how v0.1.0 first stalled.
          # `macos-15-intel` is the replacement label.
          - os: macos-15-intel      # Intel runner
            target: x86_64-apple-darwin
            pyinstaller-name: annona-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pyinstaller-name: annona-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pyinstaller-name: annona-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # At job level so a step's `if:` can read it — the `secrets` context is not
    # available in a step condition, and `env` set on the step itself is not
    # visible to that step's own `if`.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      # The macOS runners start at ~87% full and the build wants several GB
      # between cargo, PyInstaller and node_modules, so this buys ~86GB back
      # from tooling a Tauri desktop build never touches: the spare Xcodes and
      # the iOS simulator runtimes.
      #
      # Honest note on why it was written: the release was failing with "No
      # space left on device" and this looked like the cause. It was not — the
      # dmg step failed identically with 124Gi free, see
      # scripts/macos-sign-and-dmg.sh. Kept because headroom on these runners is
      # genuinely thin and the df lines make the next disk question answerable
      # from the log.
      #
      # Never fatal. A runner without these directories, or one that refuses the
      # delete, is not a reason to fail a release build.
      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          echo "== disk before"; df -h /Users/runner
          # Keep the Xcode the toolchain is actually pointed at. If it points at
          # the CommandLineTools instead, keep the newest Xcode anyway rather
          # than deleting every SDK on the box.
          KEEP="$(xcode-select -p 2>/dev/null | sed -E 's#(/Applications/Xcode[^/]*\.app).*#\1#')"
          case "$KEEP" in
            /Applications/Xcode*.app) ;;
            *) KEEP="$(ls -d /Applications/Xcode*.app 2>/dev/null | tail -1)" ;;
          esac
          echo "keeping ${KEEP:-<none — no Xcode installed>}"
          for app in /Applications/Xcode*.app; do
            if [ -e "$app" ] && [ "$app" != "$KEEP" ]; then
              echo "removing $app"
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator"
          sudo rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport"
          echo "== disk after"; df -h /Users/runner
          exit 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('ui/src-tauri/Cargo.lock', 'ui/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build Python sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller runner.spec \
            --distpath dist-sidecar \
            --workpath build/work \
            --clean --noconfirm
          mkdir -p ui/src-tauri/binaries
          mv dist-sidecar/annona "ui/src-tauri/binaries/${{ matrix.pyinstaller-name }}"
          chmod +x "ui/src-tauri/binaries/${{ matrix.pyinstaller-name }}"

      - name: Build Python sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller runner.spec --distpath dist-sidecar --workpath build/work --clean --noconfirm
          New-Item -ItemType Directory -Force -Path ui/src-tauri/binaries | Out-Null
          Move-Item -Force dist-sidecar/annona.exe "ui/src-tauri/binaries/${{ matrix.pyinstaller-name }}"

      # The cargo cache covers `ui/src-tauri/target`, and the bundle output lives
      # inside it — so a restored cache brings back the *previous version's*
      # bundles, and the glob in "Collect bundle artifacts" sweeps them into the
      # release beside the new ones. That is how v0.1.1 shipped eleven assets,
      # five of them 0.1.0, with two versions of the same installer on one page.
      - name: Clear stale bundles from the restored cache
        shell: bash
        run: rm -rf "ui/src-tauri/target/${{ matrix.target }}/release/bundle"

      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        # A throwaway keychain, unlocked for this job only. The login keychain on
        # a hosted runner is not ours to put a signing identity into, and a
        # keychain that outlives the job is a credential nobody deletes.
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build Tauri bundle
        working-directory: ui
        # macOS builds the .app only; the .dmg is made in the next step, around
        # a bundle that has been signed. There is no point during `tauri build`
        # at which the app exists and the dmg does not.
        run: npx tauri build --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '' }}
        env:
          # Signing keys for tauri-plugin-updater. With
          # `bundle.createUpdaterArtifacts: true` and a pubkey in the config,
          # this is REQUIRED: Tauri fails the build rather than producing an
          # unsigned update artefact, which is the behaviour we want — a release
          # whose updater silently does not work is worse than one that stops
          # here. The value is the key's *contents*, not a path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign the app and build the dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Signs, notarises when there are credentials, then repacks and re-signs
        # the updater archive from the signed bundle — `tauri build` wrote that
        # archive before any of this, so shipping its copy would deliver the
        # unsigned app through the update channel. See the script.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/macos-sign-and-dmg.sh ${{ matrix.target }}

      - name: Collect bundle artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p artifacts
          BUNDLE_DIR="ui/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Copy bundles and the matching .sig files the updater plugin writes
          # alongside them. The .sig is required by the updater client to
          # verify each download against the embedded public key.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg     artifacts/ 2>/dev/null || true
            # macOS's updater artefact is the .app.tar.gz, not the dmg — Tauri
            # never writes a .dmg.sig, which is why build-manifest.sh used to
            # find no signature and skip both Apple platforms.
            #
            # Both architectures produce a file called exactly `Annona.app.tar.gz`,
            # so they are renamed here. Flattened into one directory unrenamed,
            # the second job's archive silently replaces the first's and half the
            # Mac users get the wrong binary from an update that verified fine.
            VERSION="$(python3 -c "import json;print(json.load(open('ui/src-tauri/tauri.conf.json'))['version'])")"
            case "${{ matrix.target }}" in
              aarch64-apple-darwin) ARCH=aarch64 ;;
              x86_64-apple-darwin)  ARCH=x64 ;;
            esac
            for ext in "" ".sig"; do
              SRC="$BUNDLE_DIR/macos/Annona.app.tar.gz${ext}"
              [ -f "$SRC" ] && cp "$SRC" "artifacts/Annona_${VERSION}_${ARCH}.app.tar.gz${ext}"
            done
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "$BUNDLE_DIR"/nsis/*.exe     artifacts/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/nsis/*.exe.sig artifacts/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/msi/*.msi      artifacts/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/msi/*.msi.sig  artifacts/ 2>/dev/null || true
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cp "$BUNDLE_DIR"/appimage/*.AppImage     artifacts/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/appimage/*.AppImage.sig artifacts/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/deb/*.deb               artifacts/ 2>/dev/null || true
          fi
          ls -la artifacts/
          # Fail the job if no bundle was produced — silent miscompiles must not slip through.
          if [ -z "$(ls -A artifacts/ 2>/dev/null)" ]; then
            echo "::error::No bundle artifacts produced for target ${{ matrix.target }}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annona-${{ matrix.target }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only create a Release when the workflow was triggered by a tag push.
    # `workflow_dispatch` runs are smoke tests — artifacts only, no Release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          set -eux
          mkdir -p release-assets
          find artifacts/ -type f \( \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" -o \
              -name "*.app.tar.gz.sig" -o \
              -name "*.exe" -o \
              -name "*.exe.sig" -o \
              -name "*.msi" -o \
              -name "*.msi.sig" -o \
              -name "*.AppImage" -o \
              -name "*.AppImage.sig" -o \
              -name "*.deb" \
            \) -exec mv {} release-assets/ \;
          ls -la release-assets/
          if [ -z "$(ls -A release-assets/ 2>/dev/null)" ]; then
            echo "::error::No release assets collected"
            exit 1
          fi

      - name: Build updater manifest (latest.json)
        run: |
          chmod +x .github/scripts/build-manifest.sh
          .github/scripts/build-manifest.sh release-assets

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # Published, not drafted. A draft is invisible to everyone but the
          # maintainer: `releases/latest/download/...` does not resolve to it, so
          # every download button on the site 404s while the run shows green.
          # `prerelease` is the honest label for an unsigned beta; `draft` is a
          # different statement — "not finished being uploaded".
          draft: false
          # Not a prerelease either, and this is not vanity: GitHub's `latest`
          # pointer *skips* prereleases, so `releases/latest/download/<file>`
          # 404s while the release page itself renders fine — the failure looks
          # like a broken build and is a flag. The body and the site say "beta,
          # unsigned" in words, which is where that belongs.
          prerelease: false
          generate_release_notes: true
          body: |
            ## Annona ${{ github.ref_name }}

            **Beta.** On macOS, if these builds are not notarised, the right-click → **Open**
            trick no longer exists: since macOS 15 an un-notarised app that carries a quarantine
            flag is reported as damaged and **moved to the Trash**. Clear the flag on the disk
            image before opening it:

            ```bash
            xattr -dr com.apple.quarantine ~/Downloads/Annona_*.dmg
            ```

            On Windows, SmartScreen may warn; click **More info** then **Run anyway**.

            ### Downloads
            - **macOS Apple Silicon (M-series)**: `Annona_*_aarch64.dmg`
            - **macOS Intel**: `Annona_*_x64.dmg`
            - **Windows**: `Annona_*_x64-setup.exe`
            - **Linux**: `Annona_*_amd64.AppImage` or `annona_*_amd64.deb`

            See [QUICKSTART.md](../QUICKSTART.md) for usage.
