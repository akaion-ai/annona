ns-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">sends back what policy allows</text><rect x="373.145" y="112" width="137.70999999999998" height="24" rx="12" fill="#e3f1ef" stroke="#1f6f68" stroke-width="1"/><text x="442" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f6f68" text-anchor="middle">outbound HTTPS only</text><text x="24" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">WHAT STUDIO SHOWS</text><rect x="24" y="292" width="219" height="84" rx="12" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.2"/><rect x="40.0" y="306" width="82.03" height="24" rx="12" fill="#e3f1ef" stroke="#1f6f68" stroke-width="1"/><text x="81.015" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f6f68" text-anchor="middle">Completed</text><text x="40" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">the answer goes back</text><rect x="257" y="292" width="219" height="84" rx="12" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.2"/><rect x="273.0" y="306" width="122.05" height="24" rx="12" fill="#f1ebfb" stroke="#6639ba" stroke-width="1"/><text x="334.025" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6639ba" text-anchor="middle">Kept on machine</text><text x="273" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">answer only in the inbox</t