, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">AGENTS STUDIO</text><text x="48" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">someone in your org</text><text x="48" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">picks a machine, writes the task,</text><text x="48" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">closes the browser</text><rect x="62.31" y="172" width="115.38" height="24" rx="12" fill="#f1ebfb" stroke="#6639ba" stroke-width="1"/><text x="120" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6639ba" text-anchor="middle">Run on machine</text><rect x="560" y="24" width="376" height="210" rx="18" fill="#e3f1ef" stroke="#1f6f68" stroke-width="1.6" stroke-dasharray="7 6"/><g transform="translate(582,40)" fill="none" stroke="#1f6f68" stroke-width="1.6"><rect x="0" y="6" width="12" height="9" rx="2" fill="#1f6f68"/><path d="M2.5,6 V4 a3.5,3.5 0 0 1 7,0 V6"/></g><text x="602" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f6f68" text-anchor="start" letter-spacing="1.2">YOUR MACHINE · annona link serve</text><rect x="584" y="72" width="328" height="62" rx="12" fill="#1f6f68" stroke="#1f6f68" stroke-width="1.2"/><text x="748" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5"